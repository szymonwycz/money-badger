<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Badger – {{ settings.get('calc.tab_label', 'Calculator') }}</title>
<meta name="theme-color" content="#1a2535">
<link rel="manifest" href="/static/manifest.webmanifest?v={{ v }}">
<link rel="apple-touch-icon" href="/static/icon-192.png?v={{ v }}">
<link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
<div class="app">
  <img src="/static/badger.png?v={{ v }}" class="app-logo" alt="Money Badger">

  {% include "_nav.html" %}

  <div class="summary-bar">
    <div class="sum-block">
      <span class="sum-label">GROSS</span>
      <span class="sum-val sum-income" id="calc-gross">—</span>
    </div>
    <div class="sum-divider" id="vat-divider"></div>
    <div class="sum-block" id="vat-block">
      <span class="sum-label" id="vat-label">VAT</span>
      <span class="sum-val" style="color:var(--red)" id="calc-vat">—</span>
    </div>
    <div class="sum-divider" id="tax-divider"></div>
    <div class="sum-block" id="tax-block">
      <span class="sum-label" id="tax-label">TAX</span>
      <span class="sum-val" style="color:var(--red)" id="calc-tax">—</span>
    </div>
    <div class="sum-divider"></div>
    <div class="sum-block sum-block-wide">
      <span class="sum-label">NET (in hand)</span>
      <span class="sum-val" style="color:var(--green)" id="calc-net-display">—</span>
    </div>
  </div>

  <header class="month-nav">
    <button id="btn-prev">&lt;</button>
    <span id="month-label"></span>
    <button id="btn-next">&gt;</button>
  </header>

  <div class="calc-layout">

    <!-- Left: the line items -->
    <div class="calc-card">
      <div class="calc-card-title" id="plan-title">PLAN</div>

      <div id="calc-rows"></div>

      <div class="adj-add-row" style="margin-top:10px">
        <input type="text" id="new-item-name" placeholder="Item name" class="calc-input-desc">
        <input type="text" id="new-item-unit" placeholder="unit" class="calc-input-sm" style="width:70px">
        <label class="calc-note" style="display:flex;align-items:center;gap:5px;margin:0">
          <input type="checkbox" id="new-item-time"> HH:MM
        </label>
        <button class="btn btn-yellow" id="btn-add-item">Add item</button>
      </div>

      <div class="calc-total-row">
        <span>Subtotal</span>
        <span id="plan-net">—</span>
      </div>

      <button class="btn btn-blue" style="margin-top:14px;width:100%" id="btn-save-plan">Save plan</button>
    </div>

    <!-- Right: adjustments and the tax rates -->
    <div class="calc-card">
      <div class="calc-card-title">ADJUSTMENTS</div>
      <div class="calc-note">
        Add or subtract quantity from any item (extra work, cancellations).<br>
        Each adjustment is valued at that item's rate.
      </div>

      <div class="adj-add-row">
        <select id="adj-sign" class="adj-sign-sel">
          <option value="+">+</option>
          <option value="-">−</option>
        </select>
        <select id="adj-item" class="calc-input-sm" style="width:130px"></select>
        <input type="text" id="adj-qty" placeholder="qty" class="calc-input-sm" style="width:70px">
        <input type="text" id="adj-desc" placeholder="Description" class="calc-input-desc">
        <button class="btn btn-yellow" id="btn-add-adj">Add</button>
      </div>

      <div id="adj-list" class="adj-list"></div>

      <div class="calc-total-row" style="margin-top:12px">
        <span>Net adjustment</span>
        <span id="adj-net">—</span>
      </div>

      <div class="calc-card-title" style="margin-top:22px">TAX RATES</div>
      <div class="calc-note">Leave a rate empty when it doesn't apply to you.</div>
      <div class="calc-row">
        <input type="text" id="rate-vat-label" class="calc-input-sm" style="width:80px" placeholder="VAT">
        <input type="number" id="rate-vat" class="calc-input-rate" min="0" max="100" step="0.1" placeholder="—">
        <span class="calc-sep">%</span>
        <input type="text" id="rate-tax-label" class="calc-input-sm" style="width:80px" placeholder="TAX">
        <input type="number" id="rate-tax" class="calc-input-rate" min="0" max="100" step="0.1" placeholder="—">
        <span class="calc-sep">%</span>
        <button class="btn btn-blue" id="btn-save-rates">Save</button>
      </div>
    </div>

  </div>

  <div class="calc-apply-bar">
    <div class="calc-apply-info" id="apply-info"></div>
    <button class="btn btn-yellow" id="btn-apply" style="padding:10px 28px;font-size:15px">
      Apply to budget
    </button>
    <span class="calc-apply-status" id="apply-status"></span>
  </div>

</div>

<script>
const INIT_MONTH = {{ month }};
const INIT_YEAR  = {{ year }};
</script>
<script>window.MB = {{ settings|tojson }};</script>
<script src="/static/common.js?v={{ v }}"></script>
<script src="/static/calculator.js?v={{ v }}"></script>
<script src="/static/nav-badge.js?v={{ v }}"></script>
</body>
</html>
